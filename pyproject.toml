[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TDGdtf"
dynamic = ["version"]
description = "GDTF fixture parser and TouchDesigner component builder"
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
keywords = ["touchdesigner", "gdtf", "dmx", "lighting", "fixture", "derivative"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["pygdtf"]

[project.urls]
Repository = "https://github.com/TouchDesigner/TDGdtf"
Issues = "https://github.com/TouchDesigner/TDGdtf/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "twine>=5.1.1",
  "pytest>=8.0.0",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "TDGdtf.__version__"}

[tool.setuptools.package-data]
TDGdtf = [
  "*.tox",
  "td/*",
  "td/**/*",
  "assets/*",
  "assets/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["*.py[cod]", "__pycache__/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["TDGdtf*"]
exclude = [
  "TDGdtf.td",
  "TDGdtf.td.*",
  "*.__pycache__",
  "*.__pycache__.*",
]

# Type checking covers the TD-independent core package. FixtureExt.py runs only
# inside TouchDesigner (td builtins); its annotations resolve via the tdi library
# shipped in <TouchDesigner>/bin/Lib when analyzed from TD's VSCode integration.
[tool.mypy]
files = ["src/TDGdtf/core", "src/TDGdtf/__init__.py"]
python_version = "3.11"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pygdtf.*"
ignore_missing_imports = true

[tool.touchdesigner]
requiresTouchDesigner = "2025.32779"

[tool.touchdesigner.TDPyEnvManagerContext]
contextVersion = 2
createdByVersion = "1.4.3"
active = true
mode = "Python vEnv"
envName = ".venv"
installPath = "."
pythonVersion = "3.11"
autoSetup = true
autoSetupReqs = []
autoSetupSyncReqs = false
extraPaths = ["src"]
